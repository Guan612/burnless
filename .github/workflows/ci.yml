name: ci

on:
  push:
    branches: [main]
  pull_request:

# 部署走 Cloudflare Workers Builds（GitHub App 关联仓库，CF 侧自动构建部署，见 CF 控制台 Worker Settings → Builds）；
# 这里只做质量门禁。deploy job 曾依赖从未配置的 CLOUDFLARE_API_TOKEN，每次 push 必红，已移除
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
